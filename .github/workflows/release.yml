# Builds a signed Windows NSIS installer and publishes a GitHub Release with latest.json
# (the auto-updater endpoint). Triggered by pushing a tag like v0.2.0, or manually
# from the Actions tab ("Run workflow"), which tags the version from tauri.conf.json.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    name: Build and publish (Windows)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Check bundled extensions
        run: node scripts/check-extensions.mjs

      - name: Release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          {
            echo "body<<JTECH_NOTES_EOF"
            node scripts/changelog-section.mjs "$VERSION"
            echo ""
            echo ""
            echo "Installed copies update automatically."
            echo "JTECH_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build, sign and publish release
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "JTech Browser v__VERSION__"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --bundles nsis

      - name: List bundled extension resources (visibility)
        if: always()
        shell: pwsh
        run: Get-ChildItem -Recurse src-tauri/target/release -Filter manifest.json -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
